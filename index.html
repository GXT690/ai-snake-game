<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>丝绸之路 - 沙画视频</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(180deg, #f5f0e8 0%, #e8dfd0 100%);
            font-family: 'SimHei', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        #composition {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: linear-gradient(180deg, #f5f0e8 0%, #e8dfd0 100%);
            overflow: hidden;
        }

        .sand-texture {
            position: absolute;
            inset: 0;
            opacity: 0.15;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.6'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 100;
        }

        .ribbon {
            position: absolute;
            bottom: 35%;
            left: -10%;
            width: 120%;
            height: 60px;
            background: linear-gradient(90deg,
                #d4a574 0%,
                #c9a06b 20%,
                #d4a574 40%,
                #c9a06b 60%,
                #d4a574 80%,
                #c9a06b 100%);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(212, 165, 116, 0.3);
            transform-origin: center;
        }

        .ribbon::before {
            content: '';
            position: absolute;
            inset: 5px;
            background: linear-gradient(90deg,
                #e8c898 0%,
                #dcc08a 20%,
                #e8c898 40%,
                #dcc08a 60%,
                #e8c898 80%,
                #dcc08a 100%);
            border-radius: 25px;
        }

        .ribbon-edge {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 15%;
            background: linear-gradient(90deg, transparent, rgba(139, 90, 43, 0.3));
        }

        .ribbon-edge.left { left: 0; }
        .ribbon-edge.right { right: 0; }

        .silhouette-group {
            position: absolute;
            left: 15%;
            bottom: 35%;
            z-index: 20;
        }

        .silhouette {
            fill: #3d3229;
            opacity: 0.95;
        }

        .desert-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 45%;
            background: linear-gradient(180deg,
                #d4a574 0%,
                #c9a06b 30%,
                #b89060 60%,
                #a68055 100%);
            transform-origin: bottom left;
        }

        .sand-dune {
            position: absolute;
            bottom: 0;
            border-radius: 50% 50% 0 0;
            background: linear-gradient(180deg, #d4a574 0%, #c9a06b 100%);
        }

        .dune-1 { left: 0; width: 30%; height: 35%; }
        .dune-2 { left: 20%; width: 40%; height: 45%; }
        .dune-3 { left: 50%; width: 35%; height: 40%; }
        .dune-4 { left: 75%; width: 30%; height: 30%; }
        .dune-5 { left: 95%; width: 40%; height: 50%; }

        .background-element {
            position: absolute;
            fill: #4a3f35;
            opacity: 0;
        }

        .ancient-market {
            bottom: 40%;
            right: -10%;
        }

        .modern-elements {
            position: absolute;
            top: 20%;
            right: -5%;
            opacity: 0;
        }

        .tree {
            position: absolute;
            bottom: 40%;
            fill: #5d4e37;
            opacity: 0;
        }

        .road {
            position: absolute;
            bottom: 38%;
            left: -20%;
            width: 150%;
            height: 8px;
            background: linear-gradient(90deg,
                transparent 0%,
                #8b7355 20%,
                #9b8365 50%,
                #8b7355 80%,
                transparent 100%);
            border-radius: 4px;
            opacity: 0;
            z-index: 15;
        }

        .road-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: repeating-linear-gradient(90deg,
                #e8c898 0px,
                #e8c898 60px,
                transparent 60px,
                transparent 120px);
            transform: translateY(-50%);
        }

        .sand-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #c9a06b;
            border-radius: 50%;
            opacity: 0;
        }

        .black-overlay {
            position: absolute;
            inset: 0;
            background: #000;
            opacity: 0;
            z-index: 200;
        }

        .title-text {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 72px;
            font-weight: bold;
            color: #3d3229;
            letter-spacing: 20px;
            opacity: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle-text {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            color: #5d4e37;
            letter-spacing: 8px;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="composition" data-composition-id="silk-road" data-width="1920" data-height="1080" data-duration="30">
        <div class="sand-texture"></div>

        <div class="ribbon" id="ribbon">
            <div class="ribbon-edge left"></div>
            <div class="ribbon-edge right"></div>
        </div>

        <div class="silhouette-group" id="silhouetteGroup">
            <svg width="200" height="280" viewBox="0 0 200 280" class="silhouette">
                <path d="M40 260 Q30 240 35 220 Q40 200 50 190 Q60 185 70 190 Q80 195 85 210 Q90 225 85 240 Q80 255 75 260 M90 260 Q85 245 95 225 Q105 205 115 195 Q125 188 135 192 Q145 196 150 212 Q155 228 150 245 Q145 255 140 260 M55 250 L45 200 Q40 180 50 165 Q60 150 75 155 Q90 160 95 180 L85 250 M120 250 L130 200 Q135 180 125 165 Q115 150 100 155 Q85 160 80 180 L90 250" fill="#3d3229"/>
                <path d="M60 140 Q55 120 65 100 Q75 80 85 75 Q95 70 105 80 Q115 90 110 110 Q105 130 115 145 Q125 155 135 150 Q145 145 140 130 Q135 115 125 110 Q115 105 110 115 Q105 125 100 120 Q95 115 95 105 Q95 95 100 90 Q105 85 110 90 Q115 95 110 105 Q105 115 100 110" fill="#3d3229"/>
                <path d="M130 140 Q125 120 135 100 Q145 80 155 75 Q165 70 175 80 Q185 90 180 110 Q175 130 185 145 Q195 155 185 150 Q175 145 170 130 Q165 115 155 110 Q145 105 140 115 Q135 125 130 120 Q125 115 125 105 Q125 95 130 90 Q135 85 140 90 Q145 95 140 105 Q135 115 130 110" fill="#3d3229"/>
                <path d="M80 60 Q70 40 85 25 Q100 10 115 15 Q130 20 135 35 Q140 50 130 65 Q120 75 110 70 Q100 65 95 50 Q90 35 80 40 Q75 45 78 55" fill="#3d3229"/>
                <path d="M150 60 Q140 40 155 25 Q170 10 185 15 Q200 20 205 35 Q210 50 200 65 Q190 75 180 70 Q170 65 165 50 Q160 35 150 40 Q145 45 148 55" fill="#3d3229"/>
            </svg>
        </div>

        <div class="desert-layer" id="desertLayer">
            <div class="sand-dune dune-1" id="dune1"></div>
            <div class="sand-dune dune-2" id="dune2"></div>
            <div class="sand-dune dune-3" id="dune3"></div>
            <div class="sand-dune dune-4" id="dune4"></div>
            <div class="sand-dune dune-5" id="dune5"></div>
        </div>

        <svg class="background-element ancient-market" id="ancientMarket" width="600" height="300" viewBox="0 0 600 300">
            <path d="M50 280 L50 150 L100 120 L150 150 L150 280 Z" fill="#4a3f35"/>
            <path d="M200 280 L200 160 L260 130 L320 160 L320 280 Z" fill="#4a3f35"/>
            <circle cx="100" cy="260" r="25" fill="#3d3229"/>
            <circle cx="120" cy="260" r="25" fill="#3d3229"/>
            <circle cx="260" cy="260" r="30" fill="#3d3229"/>
            <circle cx="290" cy="260" r="30" fill="#3d3229"/>
            <path d="M350 280 Q340 240 350 220 Q360 200 370 220 Q380 240 370 280" fill="#3d3229"/>
            <path d="M390 280 Q380 230 390 200 Q400 180 410 200 Q420 230 410 280" fill="#3d3229"/>
            <path d="M430 280 Q425 240 435 210 Q445 190 455 210 Q465 240 460 280" fill="#3d3229"/>
            <path d="M480 280 Q475 250 485 220 Q495 200 505 220 Q515 250 510 280" fill="#3d3229"/>
            <rect x="50" y="180" width="80" height="80" fill="#5a4f45"/>
            <rect x="220" y="190" width="80" height="70" fill="#5a4f45"/>
            <circle cx="80" cy="165" r="15" fill="#6b5f55"/>
            <circle cx="250" cy="175" r="20" fill="#6b5f55"/>
        </svg>

        <svg class="modern-elements" id="modernElements" width="400" height="200" viewBox="0 0 400 200">
            <path d="M50 50 L100 45 L150 50 L200 45 L250 50 L300 45 L350 50 L390 48" stroke="#4a3f35" stroke-width="8" fill="none"/>
            <circle cx="60" cy="65" r="8" fill="#4a3f35"/>
            <circle cx="110" cy="60" r="8" fill="#4a3f35"/>
            <circle cx="160" cy="65" r="8" fill="#4a3f35"/>
            <circle cx="210" cy="60" r="8" fill="#4a3f35"/>
            <circle cx="260" cy="65" r="8" fill="#4a3f35"/>
            <circle cx="310" cy="60" r="8" fill="#4a3f35"/>
            <circle cx="360" cy="65" r="8" fill="#4a3f35"/>
            <path d="M200 100 L250 80 L300 90 L350 75" stroke="#4a3f35" stroke-width="6" fill="none"/>
            <path d="M220 85 L270 70 L320 80" stroke="#4a3f35" stroke-width="4" fill="none"/>
            <circle cx="350" cy="70" r="15" fill="#4a3f35"/>
            <rect x="100" y="120" width="200" height="60" rx="10" fill="#4a3f35"/>
            <rect x="120" y="135" width="160" height="30" fill="#5a4f45"/>
            <rect x="105" y="150" width="20" height="30" fill="#3d3229"/>
            <rect x="275" y="150" width="20" height="30" fill="#3d3229"/>
        </svg>

        <svg class="tree" id="tree1" width="60" height="120" viewBox="0 0 60 120">
            <rect x="26" y="80" width="8" height="40" fill="#4a3f35"/>
            <ellipse cx="30" cy="60" rx="25" ry="35" fill="#5d4e37"/>
            <ellipse cx="30" cy="40" rx="20" ry="25" fill="#6d5e47"/>
            <ellipse cx="30" cy="25" rx="15" ry="18" fill="#7d6e57"/>
        </svg>
        <svg class="tree" id="tree2" width="50" height="100" viewBox="0 0 50 100">
            <rect x="22" y="65" width="6" height="35" fill="#4a3f35"/>
            <ellipse cx="25" cy="50" rx="20" ry="28" fill="#5d4e37"/>
            <ellipse cx="25" cy="35" rx="16" ry="20" fill="#6d5e47"/>
        </svg>
        <svg class="tree" id="tree3" width="55" height="110" viewBox="0 0 55 110">
            <rect x="24" y="72" width="7" height="38" fill="#4a3f35"/>
            <ellipse cx="27" cy="55" rx="22" ry="30" fill="#5d4e37"/>
            <ellipse cx="27" cy="38" rx="18" ry="22" fill="#6d5e47"/>
            <ellipse cx="27" cy="24" rx="13" ry="15" fill="#7d6e57"/>
        </svg>
        <svg class="tree" id="tree4" width="45" height="90" viewBox="0 0 45 90">
            <rect x="20" y="58" width="5" height="32" fill="#4a3f35"/>
            <ellipse cx="22" cy="45" rx="18" ry="25" fill="#5d4e37"/>
            <ellipse cx="22" cy="30" rx="14" ry="18" fill="#6d5e47"/>
        </svg>
        <svg class="tree" id="tree5" width="65" height="130" viewBox="0 0 65 130">
            <rect x="28" y="88" width="9" height="42" fill="#4a3f35"/>
            <ellipse cx="32" cy="68" rx="28" ry="38" fill="#5d4e37"/>
            <ellipse cx="32" cy="48" rx="23" ry="28" fill="#6d5e47"/>
            <ellipse cx="32" cy="30" rx="16" ry="20" fill="#7d6e57"/>
        </svg>

        <div class="road" id="road">
            <div class="road-line"></div>
        </div>

        <div id="particles"></div>

        <div class="black-overlay" id="blackOverlay"></div>

        <div class="title-text" id="titleText">丝绸之路</div>
        <div class="subtitle-text" id="subtitleText">发展之路 · 时代进步</div>
    </div>

    <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const ribbon = document.getElementById('ribbon');
        const silhouetteGroup = document.getElementById('silhouetteGroup');
        const desertLayer = document.getElementById('desertLayer');
        const dunes = [document.getElementById('dune1'), document.getElementById('dune2'), document.getElementById('dune3'), document.getElementById('dune4'), document.getElementById('dune5')];
        const ancientMarket = document.getElementById('ancientMarket');
        const modernElements = document.getElementById('modernElements');
        const trees = [document.getElementById('tree1'), document.getElementById('tree2'), document.getElementById('tree3'), document.getElementById('tree4'), document.getElementById('tree5')];
        const road = document.getElementById('road');
        const blackOverlay = document.getElementById('blackOverlay');
        const titleText = document.getElementById('titleText');
        const subtitleText = document.getElementById('subtitleText');
        const particlesContainer = document.getElementById('particles');

        for (let i = 0; i < 50; i++) {
            const p = document.createElement('div');
            p.className = 'sand-particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            particlesContainer.appendChild(p);
        }
        const particles = document.querySelectorAll('.sand-particle');

        tl.from(titleText, { opacity: 0, y: 50, duration: 1.5, ease: 'power3.out' }, 0.5);
        tl.from(subtitleText, { opacity: 0, y: 30, duration: 1.2, ease: 'power2.out' }, 1.2);

        tl.to(titleText, { opacity: 0, y: -30, duration: 0.8, ease: 'power2.in' }, 4);
        tl.to(subtitleText, { opacity: 0, y: -20, duration: 0.6, ease: 'power2.in' }, 4.2);

        tl.from(ribbon, { opacity: 0, scaleX: 0.3, x: -100, duration: 2, ease: 'power3.out' }, 0.8);
        tl.from(silhouetteGroup, { opacity: 0, y: 30, duration: 1.8, ease: 'power3.out' }, 1.2);

        tl.to(ribbon, { scaleX: 1.8, height: 150, borderRadius: '50% 50% 0 0', duration: 4, ease: 'power2.inOut' }, 5);
        tl.to(ribbon, { backgroundColor: '#c9a06b', duration: 4, ease: 'power2.inOut' }, 5);

        tl.to(silhouetteGroup, { y: 80, duration: 4, ease: 'power2.inOut' }, 5);

        tl.from(desertLayer, { opacity: 0, y: 100, duration: 3, ease: 'power3.out' }, 6);

        dunes.forEach((dune, i) => {
            tl.to(dune, { x: '-50%', duration: 8, ease: 'linear' }, 6);
            tl.to(dune, { scaleY: 1 + Math.sin(i) * 0.2, y: Math.sin(i * 0.5) * 20, duration: 2, repeat: 4, ease: 'sine.inOut' }, 6);
        });

        tl.to(silhouetteGroup, { x: '+=100', duration: 8, ease: 'linear' }, 6);

        tl.to(ancientMarket, { opacity: 0.7, x: '-80%', duration: 6, ease: 'linear' }, 12);

        tl.to(silhouetteGroup, { x: '+=150', duration: 4, ease: 'power2.inOut' }, 18);

        trees.forEach((tree, i) => {
            tree.style.left = (30 + i * 12) + '%';
            tl.from(tree, { opacity: 0, scale: 0, duration: 0.8, ease: 'back.out(1.5)' }, 18 + i * 0.4);
        });

        tl.from(road, { opacity: 0, scaleX: 0, duration: 2, ease: 'power3.out' }, 20);

        tl.to(modernElements, { opacity: 0.6, x: '-150%', duration: 3, ease: 'power2.out' }, 21);

        tl.to(silhouetteGroup, { x: '+=200', scale: 1.1, duration: 3, ease: 'power2.in' }, 22);

        tl.to(particles, {
            opacity: (i) => 0.3 + Math.random() * 0.4,
            x: (i) => (Math.random() - 0.5) * 200,
            y: (i) => (Math.random() - 0.5) * 200,
            scale: (i) => 0.5 + Math.random() * 1.5,
            duration: 3,
            ease: 'power2.inOut'
        }, 25);

        tl.to(blackOverlay, { opacity: 1, duration: 3, ease: 'power2.in' }, 25);

        tl.to(silhouetteGroup, { opacity: 0, duration: 2, ease: 'power2.in' }, 26);
        tl.to(desertLayer, { opacity: 0, duration: 2, ease: 'power2.in' }, 26);
        tl.to(road, { opacity: 0, duration: 2, ease: 'power2.in' }, 26);
        trees.forEach(tree => tl.to(tree, { opacity: 0, duration: 2, ease: 'power2.in' }, 26));
        tl.to(modernElements, { opacity: 0, duration: 1, ease: 'power2.in' }, 26);

        window.__timelines['silk-road'] = tl;
    </script>
</body>
</html>
